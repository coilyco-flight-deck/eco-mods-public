[project]
name = "eco-mods-public"
version = "0.1.0"
description = "Public Eco mods (BunWulf family + others) plus the Python toolchain that builds and ships them."
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "jinja2",
    "PyYAML",
    "regex",
]

[tool.agentic-os.documentation-layout]
# Mod READMEs live inside each mod's directory as part of its distributed
# structure, so they are exempt from the root/docs/skill location rule.
excludes = ["Mods/**"]
